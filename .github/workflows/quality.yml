name: Validate game

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Extract inline JavaScript
        run: node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const m=h.match(/<script>([\\s\\S]*?)<\\/script>/);if(!m)throw new Error('script block not found');fs.writeFileSync('/tmp/game.js',m[1]);"
      - name: Check JavaScript syntax
        run: node --check /tmp/game.js
      - name: Verify required project files
        run: test -f README.md && test -f LICENSE && test -f CONTRIBUTING.md && test -f CHANGELOG.md
